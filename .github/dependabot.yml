# Dependabot config for sjs-desktop (Tauri app).
version: 2
updates:
  # --- npm ---
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # The UI is type-checked by svelte-check, whose TypeScript peer range is
  # ^5 || ^6, so the UI stays on TypeScript 6 until svelte-check takes 7. The
  # root's TypeScript is plain `tsc` and moves freely.
  - package-ecosystem: npm
    directory: /src/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # --- Rust (Tauri backend) ---
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
