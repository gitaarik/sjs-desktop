name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only the two jobs that publish can write: check-version reads the tree.
permissions:
  contents: read

jobs:
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check tag matches tauri.conf.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match tauri.conf.json version $VERSION"
            echo "Update the version in src-tauri/tauri.conf.json to $TAG before tagging."
            exit 1
          fi
          echo "Tag v$TAG matches tauri.conf.json version $VERSION"
      - name: Detect prerelease
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [[ "$TAG" == *-beta* ]] || [[ "$TAG" == *-alpha* ]] || [[ "$TAG" == *-rc* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust_target: ""
            sidecar_pkg_target: node20-linux-x64
            sidecar_triple: x86_64-unknown-linux-gnu
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            sidecar_pkg_target: node20-macos-arm64
            sidecar_triple: aarch64-apple-darwin
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            sidecar_pkg_target: node20-macos-x64
            sidecar_triple: x86_64-apple-darwin
          - platform: windows-latest
            rust_target: ""
            sidecar_pkg_target: node20-win-x64
            sidecar_triple: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    permissions:
      contents: write

    # The release notes, once for the three release attempts below.
    env:
      RELEASE_BODY: |
        ## Download

        Pick the installer for your platform:

        - **macOS (Apple Silicon)** — `.dmg` file (aarch64)
        - **macOS (Intel)** — `.dmg` file (x64)
        - **Windows** — `.msi` or `.exe` installer
        - **Linux** — `.AppImage` (universal) or `.deb` (Debian/Ubuntu)

        ## First launch

        The app downloads Chrome for Testing (~175MB) on first launch. This is a one-time download.

        ## Platform notes

        **macOS**: If you see "unidentified developer", right-click the app
        and choose **Open**, then click **Open** again in the dialog.

        **Windows**: If SmartScreen shows a warning, click **More info** then **Run anyway**.

        ## Build from source

        See [BUILD.md](https://github.com/gitaarik/sjs-desktop/blob/main/BUILD.md) for instructions.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: src-tauri

      # Linux system dependencies for Tauri
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Install Node dependencies
      - name: Install dependencies
        run: |
          npm ci
          cd src/ui && npm ci

      # Build sidecar as standalone native binary (no Node.js required at runtime)
      - name: Build sidecar
        env:
          SIDECAR_EXT: ${{ matrix.platform == 'windows-latest' && '.exe' || '' }}
        run: |
          npx esbuild src/main/sidecar.ts --bundle --platform=node \
            --outfile=dist/sidecar-bundle.cjs --format=cjs
          npx @yao-pkg/pkg dist/sidecar-bundle.cjs \
            --target ${{ matrix.sidecar_pkg_target }} \
            --output "src-tauri/binaries/sjs-sidecar-${{ matrix.sidecar_triple }}$SIDECAR_EXT"

      # Patch app identity for beta (different identifier = side-by-side install)
      - name: Patch beta identity
        if: needs.check-version.outputs.is_prerelease == 'true'
        run: node scripts/patch-beta-identity.js

      # Generate macOS .icns for beta icons (iconutil is macOS-only)
      - name: Generate beta .icns
        if: needs.check-version.outputs.is_prerelease == 'true' && startsWith(matrix.platform, 'macos')
        run: |
          ICONSET_DIR=$(mktemp -d)/icon.iconset
          mkdir -p "$ICONSET_DIR"
          cp src-tauri/icons-beta/32x32.png "$ICONSET_DIR/icon_32x32.png"
          cp src-tauri/icons-beta/64x64.png "$ICONSET_DIR/icon_32x32@2x.png"
          cp src-tauri/icons-beta/128x128.png "$ICONSET_DIR/icon_128x128.png"
          cp src-tauri/icons-beta/128x128@2x.png "$ICONSET_DIR/icon_128x128@2x.png"
          cp src-tauri/icons-beta/icon.png "$ICONSET_DIR/icon_256x256.png"
          cp src-tauri/icons-beta/icon.png "$ICONSET_DIR/icon_256x256@2x.png"
          iconutil -c icns "$ICONSET_DIR" -o src-tauri/icons/icon.icns

      # Build UI
      - name: Build UI
        working-directory: src/ui
        run: npm run build

      # Compute conditional tauri-action --bundles flag. Extracted into its
      # own step so the args: block below stays under the line-length budget.
      # Windows MSI doesn't support semver pre-release identifiers (e.g.
      # -beta.1), so on prerelease Windows builds we force --bundles nsis.
      - id: bundle-flags
        env:
          IS_PRERELEASE: ${{ needs.check-version.outputs.is_prerelease }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ] && [ "$PLATFORM" = "windows-latest" ]; then
            echo "value=--bundles nsis" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      # Build the Tauri app and create the GitHub Release, up to three times,
      # 30 s apart. tauri-action hits a known race when several platform jobs
      # upload latest.json to the same release in parallel: one job's "update
      # existing asset" call returns 404 because another job just
      # deleted+recreated the asset between our id-lookup and our update.
      # v0.4.2 release: Windows failed exactly there, even though the MSI +
      # NSIS + sigs uploaded fine just before.
      #
      # Plain steps rather than Wandalen/wretry.action, which fetches its own
      # code and the action it wraps by tag when it runs, so pinning it to a
      # commit would not have pinned the code that gets the signing key. Keep
      # the three attempts identical. The key is repeated in each one's env,
      # not set on the job, so no other step sees it (npm ci's install
      # scripts included).
      #
      # macOS code signing, once there is an Apple Developer cert: add these
      # to all three attempts' env.
      #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #   APPLE_ID: ${{ secrets.APPLE_ID }}
      #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build and release
        id: release1
        continue-on-error: true
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (generate with: npx tauri signer generate)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: v__VERSION__
          releaseName: "Smart Job Seeker v__VERSION__"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: ${{ needs.check-version.outputs.is_prerelease == 'true' }}
          # MSI doesn't support semver pre-release identifiers (e.g. -beta.1), so skip it for prereleases
          args: >-
            ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}
            ${{ steps.bundle-flags.outputs.value }}

      - name: Wait before retrying
        if: steps.release1.outcome == 'failure'
        run: sleep 30

      - name: Build and release (attempt 2)
        id: release2
        if: steps.release1.outcome == 'failure'
        continue-on-error: true
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: v__VERSION__
          releaseName: "Smart Job Seeker v__VERSION__"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: ${{ needs.check-version.outputs.is_prerelease == 'true' }}
          args: >-
            ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}
            ${{ steps.bundle-flags.outputs.value }}

      - name: Wait before retrying
        if: steps.release2.outcome == 'failure'
        run: sleep 30

      - name: Build and release (attempt 3)
        if: steps.release2.outcome == 'failure'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: v__VERSION__
          releaseName: "Smart Job Seeker v__VERSION__"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: ${{ needs.check-version.outputs.is_prerelease == 'true' }}
          args: >-
            ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}
            ${{ steps.bundle-flags.outputs.value }}

  # For beta releases: copy latest.json to the pinned beta-latest release
  # so the beta update channel always has a stable endpoint
  update-beta-latest:
    needs: [check-version, build]
    if: needs.check-version.outputs.is_prerelease == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Wait for release assets to be uploaded
        run: sleep 30

      - name: Download latest.json from this release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release download "$TAG" --pattern "latest.json" --dir ./artifacts --repo "$GITHUB_REPOSITORY"

      - name: Upload latest.json to beta-latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create beta-latest release if it doesn't exist
          if ! gh release view beta-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create beta-latest --repo "$GITHUB_REPOSITORY" \
              --title "Beta Update Channel" \
              --notes "This release is used by the beta auto-updater. Do not delete." \
              --prerelease
          fi
          # Delete existing latest.json and upload the new one
          gh release delete-asset beta-latest latest.json --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release upload beta-latest ./artifacts/latest.json --repo "$GITHUB_REPOSITORY" --clobber
